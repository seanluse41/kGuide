name: Release and Upload to Kintone

on:
  push:
    branches:
      - master

jobs:
  release-and-upload:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 'latest'

    - name: Install dependencies
      run: npm ci

    - name: Create private key file
      run: |
        echo "${{ secrets.PRIVATE_KEY_FILE }}" > private.ppk
        chmod 600 private.ppk

    - name: Build production
      run: npm run build:prod

    - name: Remove private key file
      run: rm private.ppk

    - name: Get latest release version and create new release
      id: release
      run: |
        # Fetch the latest release
        latest_release=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/latest")

        # Check if there are any releases
        if [ "$(echo $latest_release | jq -r '.message')" = "Not Found" ]; then
          echo "No releases found. Starting with version 1.0.0"
          new_version="1.0.0"
        else
          latest_version=$(echo $latest_release | jq -r '.tag_name' | sed 's/v//')
          # Increment the patch version
          new_version=$(echo $latest_version | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
        fi

        echo "New version: $new_version"

        # Create new release
        release_response=$(curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/releases" \
          -d '{
            "tag_name": "v'"$new_version"'",
            "name": "Release '"$new_version"'",
            "draft": false,
            "prerelease": false
          }')

        # Check if release was created successfully
        if [ "$(echo $release_response | jq -r '.id')" != "null" ]; then
          echo "Release v$new_version created successfully"
          echo "NEW_VERSION=$new_version" >> $GITHUB_ENV
        else
          echo "Failed to create release. Response: $release_response"
          exit 1
        fi

    - name: Upload to Kintone
      env:
        KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
        KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN }}
      run: |
        file_key=$(curl -X POST \
          -H "X-Cybozu-API-Token: $KINTONE_API_TOKEN" \
          -F "file=@dist/plugin.zip" \
          "$KINTONE_BASE_URL/k/v1/file.json" | jq -r .fileKey)

        curl -X POST \
          -H "X-Cybozu-API-Token: $KINTONE_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "app": 147,
            "record": {
              "versionNumber": {"value": "'"${{ env.NEW_VERSION }}"'"},
              "build": {"value": [{"fileKey": "'"$file_key"'"}]},
              "breaking": {"value": "No"}
            }
          }' \
          "$KINTONE_BASE_URL/k/v1/record.json"