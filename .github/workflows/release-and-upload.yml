name: Release and Upload to Kintone

on:
  push:
    branches:
      - master

jobs:
  release-and-upload:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 'latest'

    - name: Install dependencies
      run: npm ci

    - name: Create private key file
      run: |
        echo "${{ secrets.PRIVATE_KEY_FILE }}" > private.ppk
        chmod 600 private.ppk

    - name: Build production
      run: npm run build:prod

    - name: Remove private key file
      run: rm private.ppk

    - name: Get or create release version
      id: get_version
      run: |
        releases=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases")
        if [ "$(echo $releases | jq -r '.message')" = "Not Found" ]; then
          echo "No releases found. Starting with version 1.0"
          new_version="1.0"
        else
          latest_version=$(echo $releases | jq -r '.[0].tag_name' | sed 's/v//')
          if [[ $latest_version =~ ^[0-9]+\.[0-9]+$ ]]; then
            major=$(echo $latest_version | cut -d. -f1)
            minor=$(echo $latest_version | cut -d. -f2)
            new_minor=$((minor + 1))
            new_version="$major.$new_minor"
          else
            echo "Invalid version format. Starting with version 1.0"
            new_version="1.0"
          fi
        fi
        echo "NEW_VERSION=$new_version" >> $GITHUB_ENV

    - name: Create Release
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/releases \
          -d '{
            "tag_name": "v${{ env.NEW_VERSION }}",
            "name": "Release ${{ env.NEW_VERSION }}",
            "draft": false,
            "prerelease": false
          }')
        
        if [ "$response" = "201" ]; then
          echo "Release v${{ env.NEW_VERSION }} created successfully"
        elif [ "$response" = "422" ]; then
          echo "Release v${{ env.NEW_VERSION }} already exists. Incrementing version."
          NEW_VERSION=$(echo ${{ env.NEW_VERSION }} | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          
          # Try to create the release with the incremented version
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{
              "tag_name": "v'"$NEW_VERSION"'",
              "name": "Release '"$NEW_VERSION"'",
              "draft": false,
              "prerelease": false
            }'
          echo "Created release v$NEW_VERSION"
        else
          echo "Failed to create release. HTTP status: $response"
          exit 1
        fi

    - name: Upload to Kintone
      env:
        KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
        KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN }}
      run: |
        file_key=$(curl -X POST \
          -H "X-Cybozu-API-Token: $KINTONE_API_TOKEN" \
          -F "file=@dist/plugin.zip" \
          "$KINTONE_BASE_URL/k/v1/file.json" | jq -r .fileKey)

        curl -X POST \
          -H "X-Cybozu-API-Token: $KINTONE_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "app": 147,
            "record": {
              "versionNumber": {"value": "'"${{ env.NEW_VERSION }}"'"},
              "build": {"value": [{"fileKey": "'"$file_key"'"}]},
              "breaking": {"value": "No"}
            }
          }' \
          "$KINTONE_BASE_URL/k/v1/record.json"