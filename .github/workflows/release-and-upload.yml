name: Release and Upload to Kintone

on:
  push:
    branches:
      - master

jobs:
  release-and-upload:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 'latest'

    - name: Install dependencies
      run: npm ci

    - name: Create private key file
      run: |
        echo "${{ secrets.PRIVATE_KEY_FILE }}" > private.ppk
        chmod 600 private.ppk  # Set correct permissions for the key file

    - name: Build production
      run: npm run build:prod

    - name: Remove private key file
      run: rm private.ppk

    - name: Get latest release version and increment
      id: get_version
      run: |
        # Fetch all releases
        releases=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases")
        
        # Check if there are any releases
        if [ "$(echo $releases | jq '. | length')" -eq "0" ]; then
          echo "No releases found. Starting with version 1.0"
          new_version="1.0"
        else
          # Get the latest release version
          latest_version=$(echo $releases | jq -r '.[0].tag_name' | sed 's/v//')
          echo "Latest version: $latest_version"
          
          # Increment the version
          if [[ $latest_version =~ ^[0-9]+\.[0-9]+$ ]]; then
            major=$(echo $latest_version | cut -d. -f1)
            minor=$(echo $latest_version | cut -d. -f2)
            new_minor=$((minor + 1))
            new_version="$major.$new_minor"
          else
            echo "Invalid version format. Starting with version 1.0"
            new_version="1.0"
          fi
        fi
        
        echo "New version: $new_version"
        echo "NEW_VERSION=$new_version" >> $GITHUB_ENV

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ env.NEW_VERSION }}
        release_name: Release ${{ env.NEW_VERSION }}
        draft: false
        prerelease: false

    - name: Upload to Kintone
      env:
        KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
        KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN }}
      run: |
        # Upload file to Kintone
        file_key=$(curl -X POST \
          -H "X-Cybozu-API-Token: $KINTONE_API_TOKEN" \
          -F "file=@dist/plugin.zip" \
          "$KINTONE_BASE_URL/k/v1/file.json" | jq -r .fileKey)

        # Create new record in Kintone
        curl -X POST \
          -H "X-Cybozu-API-Token: $KINTONE_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "app": 147,
            "record": {
              "versionNumber": {"value": "'"${{ steps.get_version.outputs.new_version }}"'"},
              "build": {"value": [{"fileKey": "'"$file_key"'"}]},
              "breaking": {"value": "No"}
            }
          }' \
          "$KINTONE_BASE_URL/k/v1/record.json"