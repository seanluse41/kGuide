<div class="settings">
  <h2 class="settings-heading">Settings for kGuide</h2>
  <p class="kintoneplugin-desc">Please input the AppID of the guide repository app.</p>
  <p class="kintoneplugin-desc">If the repository does not exist, click the create repository app button.</p>
  
  <form class="js-submit-settings">
    <div class="kintoneplugin-row">
      <label for="message">
        Repository App ID:
        <input type="text" class="js-text-message" id="repository-appid" name="message">
      </label>
    </div>
    <div class="kintoneplugin-row">
      <label for="secretKey">
        Please enter your subscription key:
        <input type="text" class="js-text-message" id="secretKey" name="secretKey">
      </label>
    </div>
    <div class="kintoneplugin-row">
      <label for="nonAdminGuideCreation">
        <input type="checkbox" id="nonAdminGuideCreation" name="nonAdminGuideCreation">
        Allow non-admin users to create guides
      </label>
    </div>
    <div class="kintoneplugin-row">
      <button type="button" id="create-repository-button" class="kintoneplugin-button-dialog-ok">Create Repository App</button>
    </div>
    <div class="kintoneplugin-row">
      <button type="button" id="stripe-customer-portal-button" class="kintoneplugin-button-dialog-ok">Manage Subscription</button>
    </div>
    <div class="kintoneplugin-row">
      <button type="button" id="contact-support-button" class="kintoneplugin-button-dialog-ok">Contact Support</button>
    </div>
    <div class="kintoneplugin-row">
      <button type="button" class="js-cancel-button kintoneplugin-button-dialog-cancel">Cancel</button>
      <button class="kintoneplugin-button-dialog-ok">Save</button>
    </div>
  </form>
</div>
